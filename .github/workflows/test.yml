name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: moodish-ci-only
          POSTGRES_DB: moodish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOODISH_TEST_DATABASE_URL: postgresql://postgres:moodish-ci-only@localhost:5432/moodish_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Default in-memory storage, with the cross-process PostgreSQL tests.
      - run: npm test
      # The whole suite again with PostgreSQL as the app's storage.
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/moodish_android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios/Moodish
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests on an available iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$device" ] || [ "$device" = "null" ]; then
            echo '::error::No available iPhone simulator on this runner.'
            exit 1
          fi
          # Ad-hoc signing gives the simulator test host Keychain access.
          xcodebuild test -project Moodish.xcodeproj -scheme Moodish \
            -destination "id=${device}" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
