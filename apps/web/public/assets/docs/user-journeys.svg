    <text x="425" y="541.55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2a1c20">Private participant submissions contain cravings, dietary</text><text x="425" y="565.8499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2a1c20">rules and allergies. Public surfaces receive only</text><text x="425" y="590.15" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2a1c20">aggregate coverage.</text>
