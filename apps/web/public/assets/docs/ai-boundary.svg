    <text x="830" y="658.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2a1c20">AI understands language and writes friendly copy. Deterministic code still validates hard fields,</text><text x="830" y="683" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2a1c20">chooses Swiggy operations, applies constraints, ranks candidates and gates every cart write.</text>
