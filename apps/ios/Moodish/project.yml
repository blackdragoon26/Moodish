name: Moodish
options:
  bundleIdPrefix: com.moodish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES

configs:
  Debug: debug
  Release: release

targets:
  Moodish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moodish
    info:
      path: Moodish/Info.plist
      properties:
        CFBundleDisplayName: Moodish
        MoodishAPIBaseURL: "$(MOODISH_API_BASE_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - moodish
            CFBundleURLName: com.moodish.app.auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodish.app
        PRODUCT_NAME: Moodish
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          MOODISH_API_BASE_URL: http://localhost:8787
        Release:
          MOODISH_API_BASE_URL: https://moodish.onrender.com
    postbuildScripts: []
